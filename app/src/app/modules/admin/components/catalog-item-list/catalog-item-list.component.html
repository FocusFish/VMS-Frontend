<table class="catalog-items-table" mat-table [dataSource]="dataSource">
  <ng-container matColumnDef="key">
    <th
      class="overflow-column"
      mat-header-cell
      *matHeaderCellDef
      mat-sort-header
      i18n
    >
      Parameter
    </th>
    <td
      class="overflow-column"
      mat-cell
      *matCellDef="let row; let odd = odd"
      [ngClass]="{ odd: odd }"
    >
      {{ row.key }}
    </td>
  </ng-container>

  <ng-container matColumnDef="value">
    <th mat-header-cell *matHeaderCellDef mat-sort-header i18n>Value</th>
    <td mat-cell *matCellDef="let row; let odd = odd" [ngClass]="{ odd: odd }">
      {{ row.value }}
    </td>
  </ng-container>

  <ng-container matColumnDef="description">
    <th
      class="overflow-column"
      mat-header-cell
      *matHeaderCellDef
      mat-sort-header
      i18n
    >
      Description
    </th>
    <td
      class="overflow-column"
      mat-cell
      *matCellDef="let row; let odd = odd"
      [ngClass]="{ odd: odd }"
    >
      {{ row.description }}
    </td>
  </ng-container>

  <ng-container matColumnDef="edit">
    <th mat-header-cell *matHeaderCellDef mat-sort.header></th>
    <td mat-cell *matCellDef="let row; let odd = odd" [ngClass]="{ odd: odd }">
      <button mat-icon-button (click)="openEdit(row)">
        <mat-icon>edit</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayColumns"></tr>
</table>

<ng-template #editingContainer let-data>
  <form class="edit-form" [formGroup]="editForm">
    <h2>{{ data.key }}</h2>

    <mat-form-field>
      <label id="value"><strong i18n>Value</strong></label>
      <input
        type="text"
        matInput
        aria-labelledby="value"
        formControlName="value"
      />
    </mat-form-field>

    <mat-form-field>
      <label id="description"><strong i18n>Description</strong></label>
      <textarea
        type="text"
        class="description-input"
        matInput
        aria-labelledby="description"
        formControlName="description"
      ></textarea>
    </mat-form-field>

    <div class="action-area">
      <button
        mat-raised-button
        color="primary"
        (click)="updateAsset(data)"
        i18n
      >
        Save
      </button>
    </div>
  </form>
</ng-template>
