@if (menu?.length) {
<ng-container
  [ngTemplateOutlet]="menuList"
  [ngTemplateOutletContext]="{ menu: menu }"
></ng-container>
}

<ng-template #menuList let-menu="menu">
  <ul class="menu">
    @for (item of menu; track $index) {
    <li class="menu-item">
      <a mat-button routerLink="{{ item.link }}" i18n>{{ item.name }}</a>
    </li>
    }
  </ul>
</ng-template>

<router-outlet></router-outlet>

<div style="margin-top: 20px">&nbsp;</div>
