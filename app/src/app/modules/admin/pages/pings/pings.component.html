<table mat-table [dataSource]="dataSource">
  <ng-container matColumnDef="status">
    <th
      mat-header-cell
      class="status-column"
      *matHeaderCellDef
      mat-sort-header
      i18n
    ></th>
    <td
      mat-cell
      class="status-column"
      *matCellDef="let row; let odd = odd"
      [ngClass]="{ odd: odd }"
    >
      @if (row.status) {
      <span class="status green" i18n>Online</span>
      } @if (!row.status) {
      <span class="status red" i18n>Offline</span>
      }
    </td>
  </ng-container>

  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef mat-sort-header i18n>System name</th>
    <td
      mat-cell
      *matCellDef="let row; let odd = odd"
      [ngClass]="{ odd: odd }"
      i18n
    >
      {{ row.name }}
    </td>
  </ng-container>

  <ng-container matColumnDef="timestamp">
    <th mat-header-cell *matHeaderCellDef mat-sort-header i18n>Date</th>
    <td mat-cell *matCellDef="let row; let odd = odd" [ngClass]="{ odd: odd }">
      {{ row.timestamp }}
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayColumns"></tr>
</table>
