<table mat-table [dataSource]="dataSource">
  <ng-container matColumnDef="key">
    <th mat-header-cell *matHeaderCellDef mat-sort-header i18n>Parameter</th>
    <td mat-cell *matCellDef="let row">
      {{ row.key }}
    </td>
  </ng-container>

  <ng-container matColumnDef="value">
    <th mat-header-cell *matHeaderCellDef mat-sort-header i18n>Value</th>
    <td mat-cell *matCellDef="let row">
      {{ row.value }}
    </td>
  </ng-container>

  <ng-container matColumnDef="description">
    <th mat-header-cell *matHeaderCellDef mat-sort-header i18n>Description</th>
    <td mat-cell *matCellDef="let row">
      {{ row.description }}
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayColumns"></tr>
</table>
