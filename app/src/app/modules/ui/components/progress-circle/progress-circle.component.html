<div class="progress-circle-component{{ bright === true ? ' bright' : ''}}">
  @if (progress >= 0) {
    <mat-progress-spinner
      class="track"
      color="accent"
      mode="determinate"
      [diameter]="diameter"
      value="100">
    </mat-progress-spinner>
    <mat-progress-spinner
      class="progressbar"
      color="accent"
      mode="determinate"
      [diameter]="diameter"
      [value]="progress">
    </mat-progress-spinner>
  }
  @if (progress < 0) {
    <mat-progress-spinner
      class="track"
      color="warn"
      mode="determinate"
      [diameter]="diameter"
      value="100">
    </mat-progress-spinner>
  }
</div>
