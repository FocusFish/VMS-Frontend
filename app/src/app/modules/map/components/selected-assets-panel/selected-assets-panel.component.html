<div class="content-container">
  <div id="assets-map-panels">
    @for (currentAsset of selectedAssets; track trackBySelectedAssets($index, currentAsset)) {
      <map-asset-panel
        [asset]="currentAsset"
        [selectAsset]="selectAsset"
        [deselectAsset]="deselectAsset"
        [forecasts]="forecasts"
        [getAssetTrack]="getAssetTrack"
        [getAssetTrackTimeInterval]="getAssetTrackTimeInterval"
        [untrackAsset]="untrackAsset"
        [addForecast]="addForecast"
        [removeForecast]="removeForecast"
        [tracksMinuteCap]="tracksMinuteCap"
        [centerMapOnPosition]="centerMapOnPosition"
      ></map-asset-panel>
    }
  </div>
  <div id="selected-assets-control-panel">
    @if (!showControlPanel) {
      <button
        mat-raised-button
        color="primary"
        (click)="toggleControlPanel()"
        i18n
      >Tools for selected assets</button>
    }
    @if (showControlPanel) {
      <button
        mat-stroked-button
        disabled
        color="primary"
        i18n
      >Add to watchlist</button>
      <button
        mat-stroked-button
        color="primary"
        [disabled]="selectedAssets.length === 0"
        (click)="openAddToAssetGroupDialog()"
        i18n
      >Add to asset group</button>
      <button
        mat-stroked-button
        color="error"
        (click)="clearTracksAndForecasts()"
        i18n
      >Clear all tracks and forecasts</button>
      <button
        mat-stroked-button
        color="error"
        (click)="clearSelectedAssets(); clearTracksAndForecasts()"
        i18n
      >Clear selected assets</button>
      <button
        mat-raised-button
        color="primary"
        (click)="toggleControlPanel()"
        i18n
      >Close menu</button>
    }
  </div>
</div>
