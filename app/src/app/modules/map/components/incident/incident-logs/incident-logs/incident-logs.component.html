<div class="content-container">
  <mat-tab-group
    animationDuration="0ms"
    [selectedIndex]="selectedTabIndex"
    (selectedIndexChange)="changeTab($event)"
    >
    <mat-tab label="Full log">
      @if (incidentLog) {
        <map-incident-log [incidentLog]="incidentLog" [userTimezone]="userTimezone"></map-incident-log>
      }
    </mat-tab>
    <mat-tab label="Status change log">
      @if (incidentLog) {
        <map-incident-log [incidentLog]="incidentStatusLog" [userTimezone]="userTimezone"></map-incident-log>
      }
    </mat-tab>
    <mat-tab label="Manual position log">
      @if (incidentLog) {
        <map-incident-log [incidentLog]="incidentManualPositionLog" [userTimezone]="userTimezone"></map-incident-log>
      }
    </mat-tab>
  </mat-tab-group>
</div>
