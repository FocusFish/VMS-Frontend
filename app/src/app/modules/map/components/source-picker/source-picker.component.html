@if (menuActive && movementSources.length > 0) {
  <div class="content-container">
    @for (movementSource of movementSources; track movementSource) {
      <mat-checkbox
        [checked]="choosenMovementSources.includes(movementSource)"
        (change)="toggleMovementSource(movementSource)"
      >{{movementSource}}</mat-checkbox>
    }
  </div>
}
